<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyCast – Live Weather &amp; Forecast Dashboard</title>
<meta name="description" content="Live weather, hourly and 7-day forecasts for any city, powered by Open-Meteo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body data-sky="clear">
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <form id="searchForm" class="search" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search a city" aria-label="Search for a city">
      <ul id="suggest" hidden></ul>
    </form>
    <button id="locBtn" type="button">Use my location</button>
    <button id="unitBtn" type="button" aria-label="Switch temperature unit"></button>
    <button id="speedBtn" type="button" aria-label="Switch distance unit"></button>
    <button id="themeBtn" type="button" aria-label="Change theme"></button>
  </header>

  <p id="msg" role="alert" hidden></p>

  <main>
    <section id="now" class="hero" aria-live="polite">
      <p id="place"></p>
      <p id="local"></p>
      <p id="temp" class="temp">--°</p>
      <p id="cond" class="cond"></p>
      <p id="feels"></p>
    </section>

    <dl id="stats" class="stats"></dl>

    <section>
      <h2>Next 24 hours</h2>
      <div id="tabs" class="tabs"><button type="button" data-m="temp" aria-pressed="true">Temperature</button><button type="button" data-m="wind" aria-pressed="false">Wind</button><button type="button" data-m="rain" aria-pressed="false">Rain</button></div>
      <div class="chartwrap"><canvas id="chart" aria-label="Hourly temperature chart" role="img"></canvas></div>
      <ol id="hours" class="hours"></ol>
    </section>

    <section>
      <h2>7-day forecast</h2>
      <ol id="days" class="days"></ol>
    </section>

    <section>
      <h2>Air quality</h2>
      <dl id="air" class="stats"></dl>
    </section>

    <section>
      <h2>Map</h2>
      <p>Click anywhere on the map to see the weather there.</p>
      <div id="map"></div>
    </section>

    <section>
      <h2>Compare cities</h2>
      <form id="cmpForm"><input id="cq" type="search" placeholder="Compare with another city" aria-label="City to compare"></form>
      <div id="cmp" class="scroll"></div>
    </section>

    <section>
      <h2>Saved cities</h2>
      <ul id="favs" class="chips"></ul>
      <h2>Recent searches</h2>
      <ul id="recent" class="chips"></ul>
    </section>
  </main>

  <div class="tools">
    <button id="favBtn" type="button">Save city</button>
    <button id="refresh" type="button">Refresh</button>
    <span id="updated"></span>
  </div>
  <footer><p>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a></p></footer>
</div>
</body>
</html>
